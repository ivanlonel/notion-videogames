default_install_hook_types:
  - pre-commit
  - post-checkout
  - post-merge
  - post-rewrite

repos:
  - repo: meta
    hooks:
      - id: check-hooks-apply
      - id: check-useless-excludes

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.11.29
    hooks:
      - id: uv-lock
        name: uv-lock (frozen)
      - id: uv-lock
        alias: uv-lock-upgrade
        name: uv-lock (upgrade)
        args:
          - --upgrade
        stages:
          - manual
      - id: uv-export
        files: ^(uv\.lock|requirements\.txt)$
        args:
          - --frozen
          - --no-dev
          - --output-file=requirements.txt
      - id: uv-sync
        always_run: true
        args:
          - --locked

  - repo: https://github.com/tsvikas/sync-with-uv
    rev: v0.6.0
    hooks:
      - id: sync-with-uv

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args:
          - --maxkb=500
      - id: check-case-conflict
      - id: check-merge-conflict
        args:
          - --assume-in-merge
      - id: check-toml
      - id: check-yaml
        additional_dependencies:
          - ruamel-yaml==0.19.1  # sync-with-uv
      - id: debug-statements
      - id: destroyed-symlinks
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: fix-byte-order-marker
      - id: trailing-whitespace
        args:
          - --markdown-linebreak-ext=md

  - repo: https://github.com/pre-commit/pygrep-hooks
    rev: v1.10.0
    hooks:
      - id: python-check-blanket-noqa
      - id: python-check-blanket-type-ignore
      - id: python-check-mock-methods
      - id: python-use-type-annotations
      - id: text-unicode-replacement-char

  - repo: https://github.com/tox-dev/pyproject-fmt
    rev: v2.25.3
    hooks:
      - id: pyproject-fmt

  - repo: https://github.com/asottile/pyupgrade
    rev: v3.21.2
    hooks:
      - id: pyupgrade
        args:
          - --py312-plus
        exclude: ^notion_videogames/proto/
        # pyupgrade's tokenizer, pinned so it changes only with uv.lock.
        additional_dependencies:
          - tokenize-rt==6.2.0  # sync-with-uv

  - repo: https://github.com/PyCQA/isort
    rev: 8.0.1
    hooks:
      - id: isort

  - repo: https://github.com/psf/black-pre-commit-mirror
    rev: 26.5.1
    hooks:
      - id: black
        # black's tokenizer, pinned so it changes only with uv.lock.
        additional_dependencies:
          - pytokens==0.4.1  # sync-with-uv

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.22
    hooks:
      - id: ruff-check
        args:
          - --fix
          # - --unsafe-fixes
      - id: ruff-format

  - repo: https://github.com/PyCQA/flake8
    rev: 7.3.0
    hooks:
      - id: flake8
        args:
          - --config=.flake8
        language: python
        additional_dependencies:
          - flake8-2020==1.8.1  # sync-with-uv
          - flake8-absolute-import==1.0.0.3  # sync-with-uv
          - flake8-annotations==3.2.0  # sync-with-uv
          - flake8-boolean-trap==1.0.1  # sync-with-uv
          - flake8-bugbear==25.11.29  # sync-with-uv
          - flake8-builtins==3.1.0  # sync-with-uv
          - flake8-classmethod-staticmethod==2.1  # sync-with-uv
          - flake8-cognitive-complexity==0.1.0  # sync-with-uv
          - flake8-comprehensions==3.17.0  # sync-with-uv
          - flake8-docstrings==1.7.0  # sync-with-uv
          - flake8-encodings==0.5.1  # sync-with-uv
          - flake8-implicit-str-concat==0.6.0  # sync-with-uv
          - flake8-logging==1.8.0  # sync-with-uv
          - flake8-no-pep420==2.9.0  # sync-with-uv
          - flake8-noqa==1.5.0  # sync-with-uv
          - flake8-print==5.0.0  # sync-with-uv
          - flake8-pytest-style==2.2.0  # sync-with-uv
          - flake8-raise==0.0.5  # sync-with-uv
          - flake8-simplify==0.30.0  # sync-with-uv
          - flake8-tidy-imports==4.12.0  # sync-with-uv
          - flake8-type-checking==3.2.0  # sync-with-uv
          - flake8-use-fstring==1.4  # sync-with-uv
          - flake8-useless-assert==0.4.4  # sync-with-uv
          - pep8-naming==0.15.1  # sync-with-uv
          - tryceratops==2.4.1  # sync-with-uv
          # The checks' engines, pinned so they too change only with uv.lock.
          - astatine==0.3.3  # sync-with-uv
          - classify-imports==4.5.0  # sync-with-uv
          - cognitive-complexity==1.3.0  # sync-with-uv
          - flake8-helper==0.2.2  # sync-with-uv
          - flake8-plugin-utils==1.3.3  # sync-with-uv
          - mccabe==0.7.0  # sync-with-uv
          - pycodestyle==2.14.0  # sync-with-uv
          - pydocstyle==6.3.0  # sync-with-uv
          - pyflakes==3.4.0  # sync-with-uv
          - snowballstemmer==3.1.1  # sync-with-uv

  - repo: https://github.com/PyCQA/pylint
    rev: v4.0.6
    hooks:
      - id: pylint
        # pylint's inference and import-order engines, pinned so they change only with uv.lock.
        additional_dependencies:
          - astroid==4.0.4  # sync-with-uv
          - isort==8.0.1  # sync-with-uv
          - mccabe==0.7.0  # sync-with-uv

  - repo: local
    hooks:
      - id: ty-check
        name: ty check
        entry: uv run --exact ty
        args:
          - check
          - --fix
        language: system
        pass_filenames: false
        require_serial: true
        types_or:
          - python
          - pyi

      # Runs in the uv.lock environment (not an isolated hook env), so the packages it type-checks
      # against change only with uv.lock.
      - id: mypy
        name: mypy
        entry: uv run --exact mypy
        args:
          - notion_videogames
          - --show-traceback
        language: system
        pass_filenames: false
        require_serial: true
        types_or:
          - python
          - pyi

      - id: deptry
        name: deptry
        entry: uv run --exact deptry
        args:
          - .
        language: system
        pass_filenames: false
        require_serial: true
        always_run: true
