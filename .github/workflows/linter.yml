name: "✅ Linter"

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Get source code
        uses: actions/checkout@v6

      - name: Run prek
        uses: j178/prek-action@v2
        with:
          extra-args: --all-files --verbose
        env:
          SKIP: uv-lock,uv-export,sync-with-uv
