name: "✅ Linter"

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Get source code
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.2

      - name: Run prek
        uses: j178/prek-action@v3.1.0
        with:
          prek-version: "v0.5.7"
          extra-args: --all-files --verbose
