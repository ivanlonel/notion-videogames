name: "⬆️ Post-Renovate Hooks"

on:
  pull_request:
    types:
      - opened
      - synchronize

jobs:
  post-renovate-hooks:
    # Only run on PRs opened by the Renovate GitHub App. Check the PR author from the event
    # payload rather than github.actor, which reflects whoever triggered the latest run
    # (e.g. a re-run or a pushed commit) and is spoofable.
    # Renovate's lock file maintenance is never a trigger: that branch is lockfile-only, so
    # Renovate would rebuild it on every run once this job committed to it. The weekly group
    # PR refreshes the whole lock in step 0 instead, and renovate.json disables
    # lockFileMaintenance.
    if: github.event.pull_request.user.login == 'renovate[bot]' &&
      (contains(github.event.pull_request.labels.*.name, 'pep621') ||
      contains(github.event.pull_request.labels.*.name, 'pre-commit'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          # Check out the actual PR branch so we can push changes back to it.
          ref: ${{ github.head_ref }}
          token: ${{ secrets.RENOVATE_TOKEN }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          # Persist uv's download cache across runs (rolling restore-keys).
          enable-cache: true

      # ── Step 0: refresh the whole lock, on the weekly group PR only ───
      # Renovate writes uv.lock for each PR's own bumps; this stands in for its
      # lockFileMaintenance. Unlike that lockfile-only branch, this one carries a pyproject.toml
      # bump Renovate leaves alone, so the refresh can sit in this job's commit, and step 1
      # re-pins every sync-with-uv hook to it in the same commit. Each checker or engine update
      # then runs, and fails, on the PR that brings it. Major-update and security PRs stay
      # focused on their own bump.
      - name: Refresh uv.lock (weekly group PR only)
        if: github.head_ref == 'renovate/pep621-pre-commit'
        run: uv lock --upgrade

      # ── Step 1: apply the dependency-update hooks, in the required order ───
      #   sync-with-uv (reads the uv.lock Renovate updated, refreshed by step 0) → uv-export
      #   → pyproject-fmt. uv-export follows sync-with-uv so it exports with the same uv
      #   (uv-pre-commit rev) that the Linter's uv-export hook checks against.
      #
      # Each runs through prek twice: the first pass does the work and is allowed to fail
      # (prek exits 1 merely when it modifies files); the verify pass confirms the result is
      # stable — exit 0 means the first pass succeeded legitimately, exit 1 again means a real
      # error and the workflow fails.
      #
      # prek-version is pinned to uv.lock's prek; Renovate moves it with the dev group's prek.
      - name: prek – sync-with-uv (first pass)
        uses: j178/prek-action@v3.1.0
        with:
          prek-version: "v0.5.7"
          extra-args: --all-files --verbose --hook-stage manual sync-with-uv
        continue-on-error: true

      - name: prek – sync-with-uv (verify)
        uses: j178/prek-action@v3.1.0
        with:
          prek-version: "v0.5.7"
          extra-args: --all-files --verbose --hook-stage manual sync-with-uv

      - name: prek – uv-export (first pass)
        uses: j178/prek-action@v3.1.0
        with:
          prek-version: "v0.5.7"
          extra-args: --all-files --verbose --hook-stage manual uv-export
        continue-on-error: true

      - name: prek – uv-export (verify)
        uses: j178/prek-action@v3.1.0
        with:
          prek-version: "v0.5.7"
          extra-args: --all-files --verbose --hook-stage manual uv-export

      # Make sure Renovate didn't upset pyproject-fmt by, e.g., misaligning comments.
      - name: prek – pyproject-fmt (first pass)
        uses: j178/prek-action@v3.1.0
        with:
          prek-version: "v0.5.7"
          extra-args: --all-files --verbose --hook-stage manual pyproject-fmt
        continue-on-error: true

      - name: prek – pyproject-fmt (verify)
        uses: j178/prek-action@v3.1.0
        with:
          prek-version: "v0.5.7"
          extra-args: --all-files --verbose --hook-stage manual pyproject-fmt

      # ── Step 2: Commit any hook-generated changes back to the PR branch ───
      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore(deps): apply post-Renovate hooks"
          # Pin the author (default: github.actor). The run triggered by this job's own push
          # has the RENOVATE_TOKEN owner as actor; if Renovate force-pushed meanwhile, that run
          # commits the hooks onto Renovate's new head under the owner's name, which Renovate
          # doesn't ignore, so it would count the PR as modified and stop rebasing it.
          commit_author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
