name: "⬆️ Post-Renovate Hooks"

on:
  pull_request:
    types:
      - opened
      - synchronize

jobs:
  # Runs the hooks, and with them code nobody has vetted: `uv lock --upgrade` ignores
  # minimumReleaseAge and may build sdists, and the second prek pass installs the hook revs the
  # first one just bumped. So this job holds no write credential at all (read-only token,
  # nothing persisted); it only hands its diff to commit-hooks. A token on the same runner
  # would not be safe in a later step either: a hook can plant .git/hooks or leave a process
  # behind.
  post-renovate-hooks:
    # Only run on PRs opened by the Renovate GitHub App. Check the PR author from the event
    # payload rather than github.actor, which reflects whoever triggered the latest run
    # (e.g. a re-run or a pushed commit) and is spoofable.
    # Renovate's lock file maintenance is never a trigger: that branch is lockfile-only, so
    # Renovate would rebuild it on every run once this workflow committed to it. The weekly
    # group PR refreshes the whole lock in step 0 instead, and renovate.json disables
    # lockFileMaintenance.
    if: github.event.pull_request.user.login == 'renovate[bot]' &&
      (contains(github.event.pull_request.labels.*.name, 'pep621') ||
      contains(github.event.pull_request.labels.*.name, 'pre-commit'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.diff.outputs.changed }}

    steps:
      - name: Checkout PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The commit this run is for; commit-hooks refuses to push if the branch moved since.
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          # Persist uv's download cache across runs (rolling restore-keys).
          enable-cache: true

      # ── Step 0: refresh the whole lock, on the weekly group PR only ───
      # Renovate writes uv.lock for each PR's own bumps; this stands in for its
      # lockFileMaintenance. Unlike that lockfile-only branch, this one carries a pyproject.toml
      # bump Renovate leaves alone, so the refresh can sit in this workflow's commit, and step 1
      # re-pins every sync-with-uv hook to it in the same commit. Each checker or engine update
      # then runs, and fails, on the PR that brings it. Major-update and security PRs stay
      # focused on their own bump.
      - name: Refresh uv.lock (weekly group PR only)
        if: github.head_ref == 'renovate/pep621-pre-commit'
        run: uv lock --upgrade

      # ── Step 1: apply the dependency-update hooks, in the required order ───
      #   sync-with-uv (reads the uv.lock Renovate updated, refreshed by step 0) → uv-export
      #   → pyproject-fmt. uv-export follows sync-with-uv so it exports with the same uv
      #   (uv-pre-commit rev) that the Linter's uv-export hook checks against.
      #
      # Each runs through prek twice: the first pass does the work and is allowed to fail
      # (prek exits 1 merely when it modifies files); the verify pass confirms the result is
      # stable — exit 0 means the first pass succeeded legitimately, exit 1 again means a real
      # error and the workflow fails.
      #
      # prek-version is pinned to uv.lock's prek; Renovate moves it with the dev group's prek.
      - name: prek – sync-with-uv (first pass)
        uses: j178/prek-action@7b101f8338a08d2bd6fdb3625e4e7692428763a3 # v3.1.1
        with:
          prek-version: "v0.5.11"
          extra-args: --all-files --verbose --hook-stage manual sync-with-uv
        continue-on-error: true

      - name: prek – sync-with-uv (verify)
        uses: j178/prek-action@7b101f8338a08d2bd6fdb3625e4e7692428763a3 # v3.1.1
        with:
          prek-version: "v0.5.11"
          extra-args: --all-files --verbose --hook-stage manual sync-with-uv

      - name: prek – uv-export (first pass)
        uses: j178/prek-action@7b101f8338a08d2bd6fdb3625e4e7692428763a3 # v3.1.1
        with:
          prek-version: "v0.5.11"
          extra-args: --all-files --verbose --hook-stage manual uv-export
        continue-on-error: true

      - name: prek – uv-export (verify)
        uses: j178/prek-action@7b101f8338a08d2bd6fdb3625e4e7692428763a3 # v3.1.1
        with:
          prek-version: "v0.5.11"
          extra-args: --all-files --verbose --hook-stage manual uv-export

      # Make sure Renovate didn't upset pyproject-fmt by, e.g., misaligning comments.
      - name: prek – pyproject-fmt (first pass)
        uses: j178/prek-action@7b101f8338a08d2bd6fdb3625e4e7692428763a3 # v3.1.1
        with:
          prek-version: "v0.5.11"
          extra-args: --all-files --verbose --hook-stage manual pyproject-fmt
        continue-on-error: true

      - name: prek – pyproject-fmt (verify)
        uses: j178/prek-action@7b101f8338a08d2bd6fdb3625e4e7692428763a3 # v3.1.1
        with:
          prek-version: "v0.5.11"
          extra-args: --all-files --verbose --hook-stage manual pyproject-fmt

      # ── Step 2: hand the result to commit-hooks ───
      - name: Save the hook results
        id: diff
        run: |
          git diff --binary > "$RUNNER_TEMP/hooks.patch"
          git diff --stat
          if [ -s "$RUNNER_TEMP/hooks.patch" ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; fi

      - name: Upload the hook results
        if: steps.diff.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hooks-patch
          path: ${{ runner.temp }}/hooks.patch
          if-no-files-found: error
          retention-days: 1

  # Pushes post-renovate-hooks' diff with RENOVATE_TOKEN (a push with this job's own token
  # would not start CI). It runs no code from the branch: checkout, git apply, commit, push.
  commit-hooks:
    needs: post-renovate-hooks
    if: needs.post-renovate-hooks.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}

    steps:
      # artipacked is ignored on the checkout below: this job intentionally persists the
      # checkout credentials so git-auto-commit-action (last step) can push the hook results
      # back to the Renovate PR branch. Nothing from the branch runs in this job to read them.
      - name: Checkout PR branch # zizmor: ignore[artipacked]
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.RENOVATE_TOKEN }}

      - name: Stop if the branch moved since the hooks ran
        env:
          HOOKED: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$(git rev-parse HEAD)" != "$HOOKED" ]; then
            echo "::error::The branch moved past $HOOKED; the run for its new head applies the hooks."
            exit 1
          fi

      - name: Download the hook results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: hooks-patch
          path: ${{ runner.temp }}/hooks

      # Only the files the hooks are meant to touch: git apply skips every other path once an
      # --include is given.
      - name: Apply the hook results
        run: |
          git apply --include=.pre-commit-config.yaml --include=pyproject.toml --include=uv.lock \
            --include=requirements.txt "$RUNNER_TEMP/hooks/hooks.patch"
          git diff --stat

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@d0b01107b5db882071f96de5dd4b54961ea93f4c # v7
        with:
          commit_message: "chore(deps): apply post-Renovate hooks"
          # Pin the author (default: github.actor). The run triggered by this job's own push
          # has the RENOVATE_TOKEN owner as actor; if Renovate force-pushed meanwhile, that run
          # commits the hooks onto Renovate's new head under the owner's name, which Renovate
          # doesn't ignore, so it would count the PR as modified and stop rebasing it.
          commit_author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
