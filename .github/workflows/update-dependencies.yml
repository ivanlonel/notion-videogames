name: Weekly Dependency Update

on:
  schedule:
    - cron: "0 9 * * 1" # Every Monday at 09:00 UTC
  workflow_dispatch: # Allow manual triggering

jobs:
  update-dependencies:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # A PAT is required so that commits/PRs made here
          # can themselves trigger CI workflows.
          # Create a PAT with `repo` scope and store it as
          # the secret RENOVATE_TOKEN (same token Renovate uses).
          token: ${{ secrets.RENOVATE_TOKEN }}
          fetch-depth: 0

      # ── Step 1: Renovate ──────────────────────────────────────────────────
      # Renovate runs three passes, controlled by renovate.json:
      #   Pass 1 – GitHub Actions dependencies
      #   Pass 2 – pre-commit hooks (including additional-dependencies)
      #   Pass 3 – pyproject.toml dependencies (extras + dependency groups)
      - name: Run Renovate
        uses: renovatebot/github-action@v46.1.7
        with:
          configurationFile: .github/renovate.json
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}

      # Pull Renovate's changes so the hooks run on the updated files.
      - name: Pull Renovate changes
        run: git pull

      # ── Step 2: pre-commit hooks ──────────────────────────────────────────
      # pre-commit/action manages its own environment; no need to install
      # uv or pre-commit beforehand.

      # Run the three hooks in the required order.
      # Each is invoked individually so a failure in one doesn't silently
      # skip the others, and the order is guaranteed.
      - name: pre-commit – uv-lock-upgrade
        uses: pre-commit/action@v3.0.1
        with:
          extra_args: --hook-stage manual uv-lock-upgrade
        # pre-commit exits non-zero when it modifies files, so we must allow
        # failure here — the commit step will capture whatever changed.
        continue-on-error: true

      - name: pre-commit – uv-export
        uses: pre-commit/action@v3.0.1
        with:
          extra_args: uv-export
        continue-on-error: true

      - name: pre-commit – sync-with-uv
        uses: pre-commit/action@v3.0.1
        with:
          extra_args: sync-with-uv
        continue-on-error: true

      # ── Step 3: Commit & open PR (only if something changed) ─────────────
      # peter-evans/create-pull-request stages all changes, commits to a
      # dedicated branch, force-pushes it, and creates or updates the PR —
      # all in one action. If nothing changed, it's a no-op.
      - name: Create pull request
        id: create-pr
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
          branch: deps/weekly-update
          commit-message: "chore(deps): weekly dependency update"
          title: "chore(deps): weekly dependency update"
          body: |
            ## Weekly dependency update

            Automated update generated by the **Weekly Dependency Update** workflow.

            ### What changed
            - GitHub Actions bumped by Renovate
            - pre-commit hooks (+ `additional-dependencies`) bumped by Renovate
            - `pyproject.toml` dependencies (extras + groups) bumped by Renovate
            - `uv.lock` regenerated via `uv-lock-upgrade`
            - Requirements files re-exported via `uv-export`
            - Environment synced via `sync-with-uv`
          labels: dependencies, automated
          # If the branch/PR already exists from a previous run that hasn't
          # been merged yet, the branch is force-pushed and the PR updated.
          delete-branch: true

      # ── Step 4: Enable auto-merge ─────────────────────────────────────────
      # GitHub's native auto-merge merges the PR automatically once all
      # required branch-protection checks pass. Requires auto-merge to be
      # enabled in the repo settings (Settings → General → Allow auto-merge).
      - name: Enable auto-merge
        if: steps.create-pr.outputs.pull-request-number != ''
        uses: peter-evans/enable-pull-request-automerge@v3
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
          pull-request-number: ${{ steps.create-pr.outputs.pull-request-number }}
          merge-method: rebase
