name: "⬆️ Post-Renovate Hooks"

on:
  pull_request:
    types:
      - opened
      - synchronize

jobs:
  post-renovate-hooks:
    # Only run on PRs opened by the Renovate GitHub App.
    if: github.actor == 'renovate[bot]' &&
      (contains(github.event.pull_request.labels.*.name, 'pep621') ||
      contains(github.event.pull_request.labels.*.name, 'pre-commit'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v6
        with:
          # Check out the actual PR branch so we can push changes back to it.
          ref: ${{ github.head_ref }}
          token: ${{ secrets.RENOVATE_TOKEN }}

      # ── Step 1: pre-commit hooks ──────────────────────────────────────────
      # Run the hooks in the required order.
      # Each is invoked individually so a failure in one doesn't silently
      # skip the others, and the order is guaranteed.

      # Hooks are run twice: the first pass does the work and is allowed to
      # fail (prek exits 1 when it modifies files). The second pass
      # verifies the result is stable — if it exits 0, the first pass
      # succeeded legitimately; if it exits 1 again, there was a real error
      # (e.g. incompatible dependencies) and the workflow fails.
      - name: prek – uv-lock (first pass)
        uses: j178/prek-action@v2
        with:
          extra-args: --all-files --verbose --hook-stage manual uv-lock-upgrade
        continue-on-error: true

      - name: prek – uv-lock (verify)
        uses: j178/prek-action@v2
        with:
          extra-args: --all-files --verbose --hook-stage manual uv-lock-upgrade

      - name: prek – uv-export (first pass)
        uses: j178/prek-action@v2
        with:
          extra-args: --all-files --verbose --hook-stage manual uv-export
        continue-on-error: true

      - name: prek – uv-export (verify)
        uses: j178/prek-action@v2
        with:
          extra-args: --all-files --verbose --hook-stage manual uv-export

      - name: prek – sync-with-uv (first pass)
        uses: j178/prek-action@v2
        with:
          extra-args: --all-files --verbose --hook-stage manual sync-with-uv
        continue-on-error: true

      - name: prek – sync-with-uv (verify)
        uses: j178/prek-action@v2
        with:
          extra-args: --all-files --verbose --hook-stage manual sync-with-uv

      # ── Step 2: Commit any hook-generated changes back to the PR branch ───
      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore(deps): apply post-Renovate hooks"
