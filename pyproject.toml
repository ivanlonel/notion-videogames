[project]
name = "notion-videogames"
version = "0.1"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
  { name = "Ivan Donisete Lonel", email = "ivanlonel91@gmail.com" },
]
requires-python = ">=3.12"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "betterproto2~=0.10",
  "howlongtobeatpy~=1.0",
  "igdb-api-v4~=0.3.3",
  "notion-client",           # Let ultimate-notion dictate notion-client's version
  "pydantic~=2.13.4",
  "python-dotenv~=1.2",
  "requests~=2.34",
  "tenacity~=9.1",
  "ultimate-notion~=0.10.1",
  "urllib3",                 # Let requests dictate urllib3's version
]
urls.Repository = "https://github.com/ivanlonel/notion-videogames"

[dependency-groups]
dev = [
  "black~=26.5",
  "deptry~=0.25",
  "flake8~=7.3",
  "flake8-2020~=1.8",
  "flake8-absolute-import~=1.0",
  "flake8-annotations~=3.2",
  "flake8-boolean-trap~=1.0",
  "flake8-bugbear~=25.11",
  "flake8-builtins~=3.1",
  "flake8-classmethod-staticmethod~=2.1",
  "flake8-cognitive-complexity~=0.1",
  "flake8-comprehensions~=3.17",
  "flake8-docstrings~=1.7",
  "flake8-encodings~=0.5",
  "flake8-implicit-str-concat~=0.6",
  "flake8-logging~=1.8",
  "flake8-no-pep420~=2.9",
  "flake8-noqa~=1.5",
  "flake8-print~=5.0",
  "flake8-pytest-style~=2.2",
  "flake8-raise~=0.0.5",
  "flake8-simplify~=0.30",
  "flake8-tidy-imports~=4.12",
  "flake8-type-checking~=3.2",
  "flake8-use-fstring~=1.4",
  "flake8-useless-assert~=0.4",
  "isort~=8.0",
  "mypy[faster-cache]~=2.1",
  "pep8-naming~=0.15",
  "prek~=0.4",
  "pylint~=4.0",
  "ruff~=0.15",
  "tryceratops~=2.4",
  "ty~=0.0.55",
  "types-requests~=2.33",
]
# This group lists packages that are not installed in the local environment but are used
# as pre-commit hooks. The goal is to keep the package versions controlled by uv and
# synchronized in .pre-commit-config.yaml through sync-with-uv, since `prek autoupdate`
# ignores certain interpreter version constraints.
hooks = [
  "pre-commit-hooks~=6.0",
  "pyproject-fmt~=2.25",
  "pyupgrade~=3.21",
  "sync-with-uv~=0.5",
  "uv~=0.11",
]

[tool.black]
line-length = 99
force-exclude = "notion_videogames/proto"

[tool.ruff]
required-version = ">=0.9"
line-length = 99
extend-exclude = [
  "notion_videogames/proto/",
]
lint.select = [ "ALL" ]
lint.ignore = [
  "COM812", # Trailing comma missing
  "D1",     # Missing Docstrings (pydocstyle)
  "D203",   # Use a blank line to separate the docstring from the class definition
  "D212",   # Multi-line docstring summary should start at the first line
  "E203",   # Whitespace before ',', ';', or ':'
  # (Black enforces an equal amount of whitespace around slice operators)
  "E501",   # Line too long (pycodestyle)
  "E701",   # Multiple statements on one line (colon)
  # (Black collapses classes/functions consisting of ... to a single line)
  "ERA001", # Found commented-out code
]
lint.flake8-annotations.allow-star-arg-any = true
lint.mccabe.max-complexity = 15  # default 10  # C901

[tool.isort]
profile = "black"
line_length = 99
extend_skip_glob = [
  "notion_videogames/proto/*",
]
skip_gitignore = true

[tool.pycln]
all = true
extend_exclude = "notion_videogames/proto"

[tool.pylint]
messages_control.disable = [
  "import-error",               # E0401
  "line-too-long",              # C0301
  "missing-class-docstring",    # C0115
  "missing-function-docstring", # C0116
  "missing-module-docstring",   # C0114
  "too-few-public-methods",     # R0903
]
ignore-paths = [
  "^notion_videogames/proto/.*$",
]

[tool.deptry]
extend_exclude = [
  "notion_videogames.proto",
]

[tool.mypy]
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
warn_unreachable = true
enable_error_code = [
  "deprecated",
  "exhaustive-match",
  "explicit-override",
  "ignore-without-code",
  "mutable-override",
  "possibly-undefined",
  "redundant-expr",
  "redundant-self",
  "truthy-bool",
  "truthy-iterable",
  "unimported-reveal",
  "unused-awaitable",
]
extra_checks = true
strict_equality = true
strict_equality_for_none = true
show_error_context = true
show_column_numbers = true
warn_unused_configs = true
overrides = [
  { module = [
    "howlongtobeatpy.*",
    "igdb.*",
  ], ignore_missing_imports = true },
  { module = [
    "notion_videogames.proto.*",
  ], ignore_errors = true },
]
no_implicit_reexport = true

[tool.ty]
analysis.respect-type-ignore-comments = false

[tool.sync-with-uv]
repo-to-package."https://github.com/astral-sh/uv-pre-commit" = "uv"
