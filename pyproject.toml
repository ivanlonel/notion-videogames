[project]
name = "notion-videogames"
version = "0.1"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
  { name = "Ivan Donisete Lonel", email = "ivanlonel91@gmail.com" },
]
requires-python = ">=3.12"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "betterproto~=2.0.0b7",
  "howlongtobeatpy~=1.0.20",
  "igdb-api-v4~=0.3.3",
  "notion-client>=2.5",
  "pydantic>=2.12",
  "python-dotenv~=1.2.2",
  "requests~=2.33.0",
  "tenacity~=9.1.4",
  "ultimate-notion~=0.9.6",
]
urls.Repository = "https://github.com/ivanlonel/notion-videogames"

[dependency-groups]
dev = [
  "bandit>=1.9.4",
  "black>=26.3.1",
  "flake8>=7.3",
  "flake8-2020~=1.8",
  "flake8-absolute-import~=1.0",
  "flake8-annotations~=3.2",
  "flake8-boolean-trap~=1.0",
  "flake8-bugbear~=25.11.29",
  "flake8-builtins~=3.1",
  "flake8-classmethod-staticmethod~=2.1",
  "flake8-cognitive-complexity~=0.1",
  "flake8-comprehensions~=3.17",
  "flake8-datetimez~=20.10",
  "flake8-docstrings~=1.7",
  "flake8-encodings~=0.5",
  "flake8-implicit-str-concat~=0.6",
  "flake8-logging~=1.8",
  "flake8-no-pep420~=2.9",
  "flake8-noqa~=1.5",
  "flake8-print~=5.0",
  "flake8-pytest-style~=2.2",
  "flake8-raise~=0.0.5",
  "flake8-return~=1.2",
  "flake8-simplify~=0.30",
  "flake8-tidy-imports~=4.12",
  "flake8-type-checking~=3.2",
  "flake8-use-fstring~=1.4",
  "flake8-useless-assert~=0.4",
  "isort>=8.0.1",
  "mypy>=1.19.1",
  "pep8-naming~=0.15",
  "pre-commit~=4.5",
  "pylint>=4.0.5",
  "ruff>=0.15.7",
  "tryceratops~=2.4",
  "types-requests~=2.32",
]

[tool.black]
line-length = 99

[tool.ruff]
required-version = ">=0.15"
line-length = 99
exclude = [
  "igdb_proto.py",
]
lint.select = [ "ALL" ]
lint.ignore = [
  "COM812", # Trailing comma missing
  "D1",     # Missing Docstrings (pydocstyle)
  "D203",   # Use a blank line to separate the docstring from the class definition
  "D212",   # Multi-line docstring summary should start at the first line
  "E203",   # Whitespace before ‘,’, ‘;’, or ‘:’
  # (Black enforces an equal amount of whitespace around slice operators)
  "E501",   # Line too long (pycodestyle)
  "E701",   # Multiple statements on one line (colon)
  # (Black collapses classes/functions consisting of ... to a single line)
  "ERA001", # Found commented-out code
]
lint.flake8-annotations.allow-star-arg-any = true
lint.mccabe.max-complexity = 15  # default 10  # C901

[tool.isort]
profile = "black"
line_length = 99
skip_gitignore = true

[tool.pycln]
all = true

[tool.pylint]
ignore = [
  "igdb_proto.py",
]
messages_control.disable = [
  "missing-module-docstring",   # C0114
  "missing-class-docstring",    # C0115
  "missing-function-docstring", # C0116
  "line-too-long",              # C0301
  "import-error",               # E0401
  "too-few-public-methods",     # R0903
]

[tool.mypy]
enable_error_code = [
  "deprecated",
  "exhaustive-match",
  "explicit-override",
  "ignore-without-code",
  "mutable-override",
  "possibly-undefined",
  "redundant-expr",
  "redundant-self",
  "truthy-bool",
  "truthy-iterable",
  "unimported-reveal",
  "unused-awaitable",
]
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_untyped_defs = true
extra_checks = true
no_implicit_reexport = true
show_column_numbers = true
show_error_context = true
strict_bytes = true
strict_equality = true
strict_equality_for_none = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
warn_unused_configs = true
warn_unused_ignores = true
overrides = [
  { module = [
    "howlongtobeatpy.*",
    "igdb.*",
  ], ignore_missing_imports = true },
  { module = [ "notion_videogames.igdb_proto" ], disable_error_code = [
    "explicit-override",
  ] },
]
